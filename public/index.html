<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Manager Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-40 px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-500/10 p-2.5 rounded-xl border border-emerald-500/20 text-emerald-400">
          <i class="fa-brands fa-whatsapp text-2xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-none">WhatsApp Manager</h1>
          <span class="text-xs text-slate-400 font-medium">Painel de Gerenciamento de Sessões</span>
        </div>
      </div>

      <div class="flex items-center gap-3 w-full md:w-auto">
        <button onclick="openSendMsg()" class="flex-1 md:flex-initial inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
          <i class="fa-solid fa-paper-plane"></i>
          Enviar Mensagem
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Notificação / Toast Box -->
    <div id="toastBox" class="lg:col-span-12 hidden">
      <div id="toastContent" class="p-4 rounded-xl border flex items-center justify-between"></div>
    </div>

    <!-- Painel Esquerdo: Sessões & Conexão (5 Cols) -->
    <section class="lg:col-span-5 space-y-6">
      
      <!-- Card: Controle de Sessão -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 shadow-xl backdrop-blur">
        <h2 class="text-sm uppercase tracking-wider text-slate-400 font-bold mb-4 flex items-center gap-2">
          <i class="fa-solid fa-plug text-emerald-400"></i> Gerenciador de Instâncias
        </h2>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Sessões Ativas</label>
            <div class="flex gap-2">
              <select id="activeSessions" class="flex-1 bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                <option value="">Nenhuma sessão ativa</option>
              </select>
              <button onclick="downloadSessionZip()" title="Baixar Dados da Sessão em ZIP" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2.5 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                <i class="fa-solid fa-file-arrow-down"></i>
                <span class="hidden sm:inline">Baixar ZIP</span>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nova Instância</label>
            <div class="flex gap-2">
              <input id="sessionName" placeholder="Ex: minha-sessao" class="flex-1 bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
              <button onclick="start()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                <i class="fa-solid fa-power-off text-emerald-400"></i> Iniciar
              </button>
            </div>
          </div>

          <!-- Status Card -->
          <div id="status" class="bg-slate-900/50 border border-slate-700/50 rounded-xl p-3.5 text-sm text-slate-300 font-medium flex items-center gap-3">
            <i class="fa-solid fa-circle-info text-blue-400"></i> Aguardando ação...
          </div>
        </div>
      </div>

      <!-- NOVO CARD: Restaurar / Upload de Sessão ZIP -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 shadow-xl backdrop-blur">
        <h2 class="text-sm uppercase tracking-wider text-slate-400 font-bold mb-3 flex items-center gap-2">
          <i class="fa-solid fa-file-import text-amber-400"></i> Importar Sessão (ZIP)
        </h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Nome Único da Sessão</label>
            <input id="uploadSessionName" placeholder="Ex: sessao-restaurada" class="w-full bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Arquivo ZIP da Sessão</label>
            <input type="file" id="zipFileInput" accept=".zip" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600">
          </div>
          <button onclick="uploadSessionZip()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-upload"></i> Upload & Conectar Sessão
          </button>
        </div>
      </div>

      <!-- Card: QR Code -->
      <div id="qrBox" class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 shadow-xl text-center hidden">
        <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center justify-center gap-2">
          <i class="fa-solid fa-qrcode text-emerald-400"></i> Escaneie o QR Code
        </h3>
        <div class="bg-white p-3 rounded-xl inline-block shadow-inner">
          <canvas id="qrCanvas"></canvas>
        </div>
        <div id="qrInfo" class="mt-4 text-xs font-semibold text-slate-400"></div>
      </div>

      <!-- Card: Perfil Conectado -->
      <div id="accountBox" class="bg-slate-800/50 border border-emerald-500/30 rounded-2xl p-5 shadow-xl hidden">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-xl font-bold">
            <i class="fa-solid fa-user-check"></i>
          </div>
          <div>
            <h3 id="accName" class="font-bold text-slate-100">---</h3>
            <p id="accNumber" class="text-xs text-slate-400 font-mono">---</p>
          </div>
        </div>
      </div>

    </section>

    <!-- Painel Direito: Grupos & Logs (7 Cols) -->
    <section class="lg:col-span-7 space-y-6">

      <!-- Card: Lista de Grupos -->
      <div id="groupsBox" class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 shadow-xl hidden">
        <h3 class="text-sm uppercase tracking-wider text-slate-400 font-bold mb-4 flex items-center gap-2">
          <i class="fa-solid fa-users text-emerald-400"></i> Grupos Encontrados
        </h3>
        <div id="groupsList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-60 overflow-y-auto pr-1"></div>
      </div>

      <!-- Card: Console de Logs -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 shadow-xl flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm uppercase tracking-wider text-slate-400 font-bold flex items-center gap-2">
            <i class="fa-solid fa-terminal text-emerald-400"></i> Console do Sistema
          </h3>
          <button onclick="document.getElementById('logs').innerHTML=''" class="text-xs text-slate-500 hover:text-slate-300 transition">
            Limpar
          </button>
        </div>
        <div id="logs" class="bg-slate-950/80 font-mono text-xs text-emerald-400 p-4 rounded-xl border border-slate-800 h-64 overflow-y-auto space-y-1.5 leading-relaxed"></div>
      </div>

    </section>
  </main>

  <!-- Modal / Popup Overlay -->
  <div id="popup" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden justify-center items-center p-4">
    <div id="popupContent" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4"></div>
  </div>

  <!-- Componentes Externos -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <script>
    // Conexão Socket.IO
    const socket = io('https://busines-ae3h.onrender.com');

    // Mapeamento de Elementos
    const status = document.getElementById('status');
    const qrBox = document.getElementById('qrBox');
    const qrCanvas = document.getElementById('qrCanvas');
    const qrInfo = document.getElementById('qrInfo');
    const accName = document.getElementById('accName');
    const accNumber = document.getElementById('accNumber');
    const accountBox = document.getElementById('accountBox');
    const groupsBox = document.getElementById('groupsBox');
    const groupsList = document.getElementById('groupsList');
    const logs = document.getElementById('logs');
    const popup = document.getElementById('popup');
    const popupContent = document.getElementById('popupContent');
    const activeSessionsSelect = document.getElementById('activeSessions');
    const toastBox = document.getElementById('toastBox');
    const toastContent = document.getElementById('toastContent');

    let currentSession = null;

    // Notificações Toast
    function showNotification(msg, isError = false) {
      toastBox.classList.remove('hidden');
      toastContent.className = `p-4 rounded-xl border text-sm font-semibold flex items-center justify-between ${
        isError 
          ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' 
          : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'
      }`;
      toastContent.innerHTML = `
        <div class="flex items-center gap-2">
          <i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i>
          <span>${msg}</span>
        </div>
        <button onclick="toastBox.classList.add('hidden')" class="text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      `;
      setTimeout(() => toastBox.classList.add('hidden'), 6000);
    }

    // Saída do Console
    function log(msg) {
      const d = document.createElement('div');
      d.className = 'border-b border-slate-900/50 pb-0.5';
      d.textContent = msg;
      logs.appendChild(d);
      logs.scrollTop = logs.scrollHeight;
    }

    // Iniciar Nova Sessão
    function start() {
      let name = document.getElementById('sessionName').value.trim();
      const existing = activeSessionsSelect.value;
      if (existing) name = existing;
      if (!name) return showNotification('Informe o nome da sessão', true);
      
      currentSession = name;
      status.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-amber-400"></i> <span>Iniciando sessão "${name}"...</span>`;
      socket.emit('start-session', name);
    }

    // Solicitar ZIP da Sessão
    function downloadSessionZip() {
      const selectedSession = activeSessionsSelect.value || currentSession;
      if (!selectedSession) {
        return showNotification('Selecione uma sessão para baixar o ZIP.', true);
      }
      log(`📦 Solicitando pacote da sessão "${selectedSession}"...`);
      socket.emit('download-session', selectedSession);
    }

    // Upload de Sessão via ZIP
    function uploadSessionZip() {
      const sessionName = document.getElementById('uploadSessionName').value.trim();
      const fileInput = document.getElementById('zipFileInput');

      if (!sessionName) {
        return showNotification('Digite um nome único para a sessão importada.', true);
      }
      if (!fileInput.files || fileInput.files.length === 0) {
        return showNotification('Selecione o arquivo ZIP da sessão.', true);
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      status.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-amber-400"></i> <span>Enviando e validando sessão...</span>`;
      log(`📤 Iniciando upload do arquivo ZIP para a sessão "${sessionName}"...`);

      reader.onload = function(e) {
        const base64Data = e.target.result.split(',')[1];
        socket.emit('upload-session', {
          sessionName,
          zipBase64: base64Data
        });
      };

      reader.readAsDataURL(file);
    }

    // Eventos do Socket
    socket.on('log', log);

    socket.on('upload-status', d => {
      if (d.success) {
        showNotification(d.message);
        status.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> <span>Sessão restaurada!</span>`;
      } else {
        showNotification(d.message, true);
        status.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400"></i> <span>Falha ao restaurar sessão</span>`;
      }
    });

    socket.on('session-zip-data', d => {
      try {
        const byteCharacters = atob(d.zipBase64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: 'application/zip' });

        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = d.fileName || `session-${d.session}.zip`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showNotification(`Download do ZIP da sessão "${d.session}" concluído!`);
      } catch (err) {
        log(`❌ Erro no processamento do ZIP: ${err.message}`);
        showNotification('Erro ao processar o arquivo ZIP.', true);
      }
    });

    socket.on('update-active-sessions', d => {
      activeSessionsSelect.innerHTML = '';
      if (d.sessions && d.sessions.length > 0) {
        d.sessions.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          activeSessionsSelect.appendChild(opt);
        });
      } else {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = d.message || 'Nenhuma sessão ativa';
        activeSessionsSelect.appendChild(opt);
      }
    });

    socket.on('qr', d => {
      qrBox.classList.remove('hidden');
      QRCode.toCanvas(qrCanvas, d.qr, { width: 180, margin: 1 }, function(error) {
        if (error) console.error(error);
      });
      qrInfo.textContent = `📷 Escaneie o QR Code (Tentativa ${d.attempt}/15)`;
      status.innerHTML = `<i class="fa-solid fa-qrcode text-emerald-400"></i> <span>Aguardando leitura do QR Code</span>`;
    });

    socket.on('session-ready', d => {
      qrBox.classList.add('hidden');
      status.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> <span>Sessão conectada com sucesso!</span>`;
      accName.textContent = d.accountInfo.name;
      accNumber.textContent = d.accountInfo.number;
      accountBox.classList.remove('hidden');

      groupsBox.classList.remove('hidden');
      groupsList.innerHTML = '';

      d.accountInfo.groups.forEach(g => {
        const div = document.createElement('div');
        div.className = 'bg-slate-900/60 border border-slate-700/50 p-3 rounded-xl flex items-center gap-3 text-xs';
        div.innerHTML = `
          <div class="bg-slate-800 p-2 rounded-lg text-slate-400">
            <i class="fa-solid fa-users-line"></i>
          </div>
          <span class="font-semibold text-slate-200 truncate">${g.name}</span>
        `;
        groupsList.appendChild(div);
      });
    });

    socket.on('session-disconnected-alert', d => {
      showNotification(`🚨 A sessão "${d.session}" foi desconectada em tempo real!`, true);
      status.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-400"></i> <span>Sessão "${d.session}" desconectada.</span>`;
    });

    function openSendMsg() {
      popupContent.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-700 pb-3">
          <h3 class="font-bold text-slate-100 flex items-center gap-2">
            <i class="fa-solid fa-paper-plane text-emerald-400"></i> Enviar Mensagem
          </h3>
          <button onclick="popup.classList.add('hidden')" class="text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Número do Destinatário</label>
            <input id="msgNum" placeholder="Ex: 5511999999999" class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Mensagem</label>
            <textarea id="msgTxt" rows="4" placeholder="Digite sua mensagem aqui..." class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
          </div>
          <button onclick="sendMsg()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">
            Enviar Agora
          </button>
        </div>
      `;
      popup.classList.remove('hidden');
      popup.classList.add('flex');
    }

    function sendMsg() {
      const number = document.getElementById('msgNum').value.trim();
      const text = document.getElementById('msgTxt').value.trim();
      if (!number || !text) return showNotification('Preencha o número e a mensagem', true);
      
      popup.classList.add('hidden');
      socket.emit('send-message', { session: currentSession, number, text });
    }

    socket.on('msg-status', d => {
      if (d.error) showNotification(`Falha no envio para ${d.number}: ${d.error}`, true);
      if (d.success) showNotification(`Mensagem enviada com sucesso para ${d.number}!`);
    });

    popup.onclick = e => { if (e.target === popup) popup.classList.add('hidden'); };
  </script>
</body>
</html>
