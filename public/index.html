<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WhatsApp Session Manager</title>
<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#4facfe,#00f2fe);
  padding:20px;
  color:#fff;
  text-align:center;
}
input, button {
  padding:12px;
  font-size:16px;
}
button {
  background:#ff9800;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
#qrBox, #sessionBox {
  background:#fff;
  color:#000;
  padding:15px;
  border-radius:12px;
  margin-top:20px;
  display:none;
}
#logs {
  background:#fff;
  color:#000;
  margin-top:20px;
  padding:10px;
  border-radius:10px;
  max-height:300px;
  overflow:auto;
  text-align:left;
  font-size:13px;
}
#downloadBtn {
  background:#28a745;
  margin-top:10px;
}
</style>
</head>

<body>

<h2>WhatsApp Web – Sessão</h2>

<input id="sessionName" placeholder="Nome da sessão">
<button onclick="startSession()">Iniciar</button>

<div id="status">Aguardando...</div>

<div id="qrBox">
  <canvas id="qrCanvas" width="260" height="260"></canvas>
  <div id="qrAttempts"></div>
</div>

<div id="sessionBox">
  <h3 id="sessionTitle"></h3>
  <button id="downloadBtn" disabled>⬇️ ZIP ainda não disponível</button>
</div>

<div id="logs"></div>

<script src="https://busines-3nfg.onrender.com/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
const socket = io('https://busines-3nfg.onrender.com', {
  transports:['websocket']
});

const logs = document.getElementById('logs');
const statusDiv = document.getElementById('status');
const qrBox = document.getElementById('qrBox');
const qrCanvas = document.getElementById('qrCanvas');
const qrAttempts = document.getElementById('qrAttempts');
const sessionBox = document.getElementById('sessionBox');
const sessionTitle = document.getElementById('sessionTitle');
const downloadBtn = document.getElementById('downloadBtn');

function log(msg){
  const d = document.createElement('div');
  d.textContent = msg;
  logs.appendChild(d);
  logs.scrollTop = logs.scrollHeight;
}

function startSession(){
  const name = document.getElementById('sessionName').value.trim();
  if(!name) return alert('Digite o nome da sessão');
  socket.emit('start-session', name);
  statusDiv.textContent = '🚀 Iniciando sessão...';
  log('🚀 Sessão solicitada: ' + name);
}

socket.on('log', msg => log(msg));

socket.on('qr', data => {
  qrBox.style.display = 'block';
  sessionBox.style.display = 'none';

  const ctx = qrCanvas.getContext('2d');
  ctx.clearRect(0,0,qrCanvas.width,qrCanvas.height);

  QRCode.toCanvas(qrCanvas, data.qr, { width:260 });
  qrAttempts.textContent = `Tentativa ${data.attempt}/15`;
  statusDiv.textContent = '📷 Escaneie o QR Code';
});

socket.on('session-ready', data => {
  qrBox.style.display = 'none';
  sessionBox.style.display = 'block';
  sessionTitle.textContent = 'Sessão: ' + data.session;

  if (data.zipStatus === 'ready') {
    statusDiv.textContent = '✅ ZIP pronto para download';
    downloadBtn.disabled = false;
    downloadBtn.textContent = '⬇️ Baixar ZIP da Sessão';
    downloadBtn.onclick = () => {
      window.location.href =
        'https://busines-3nfg.onrender.com' + data.zipFile;
    };
    log('✅ ZIP confirmado como pronto');
  } else {
    statusDiv.textContent = '⚠️ Sessão conectada, ZIP não disponível';
    log('⚠️ ZIP não pôde ser criado');
  }
});

socket.on('session-ended', data => {
  statusDiv.textContent = '❌ Sessão encerrada';
  qrBox.style.display = 'none';
  sessionBox.style.display = 'none';
  log('❌ Sessão encerrada: ' + data.reason);
});
</script>

</body>
</html>
