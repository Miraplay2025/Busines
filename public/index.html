<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Session</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#4facfe,#00f2fe);
  padding:15px;
  color:#fff;
}
.container {
  max-width:420px;
  margin:auto;
  text-align:center;
}
input, button {
  width:100%;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  border-radius:8px;
  border:none;
}
button {
  background:#ff9800;
  color:#fff;
}
#downloadBtn {
  background:#28a745;
}
.box {
  background:#fff;
  color:#000;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
}
#logs {
  max-height:220px;
  overflow:auto;
  font-size:13px;
}
canvas {
  width:100%;
  max-width:260px;
}
</style>
</head>

<body>

<div class="container">
  <h2>WhatsApp Web</h2>

  <input id="sessionName" placeholder="Nome da sessão">
  <button onclick="start()">Iniciar Sessão</button>

  <div id="status">Aguardando...</div>

  <div id="qrBox" class="box">
    <canvas id="qr"></canvas>
    <div id="qrInfo"></div>
  </div>

  <div id="downloadBox" class="box">
    <h3 id="sessionTitle"></h3>
    <button id="downloadBtn" disabled>ZIP ainda não pronto</button>
  </div>

  <div id="logs" class="box"></div>
</div>

<script src="https://busines-3nfg.onrender.com/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
const socket = io('https://busines-3nfg.onrender.com', {
  transports:['websocket']
});

const logBox = document.getElementById('logs');
const status = document.getElementById('status');
const qrBox = document.getElementById('qrBox');
const qrCanvas = document.getElementById('qr');
const qrInfo = document.getElementById('qrInfo');
const downloadBox = document.getElementById('downloadBox');
const downloadBtn = document.getElementById('downloadBtn');
const sessionTitle = document.getElementById('sessionTitle');

function log(msg){
  const d = document.createElement('div');
  d.textContent = msg;
  logBox.appendChild(d);
  logBox.scrollTop = logBox.scrollHeight;
  logBox.style.display = 'block';
}

function start(){
  const name = document.getElementById('sessionName').value.trim();
  if(!name) return alert('Digite o nome da sessão');
  socket.emit('start-session', name);
  status.textContent = '🚀 Iniciando sessão...';
}

socket.on('log', log);

socket.on('qr', d => {
  qrBox.style.display = 'block';
  downloadBox.style.display = 'none';
  QRCode.toCanvas(qrCanvas, d.qr, { width:260 });
  qrInfo.textContent = `Tentativa ${d.attempt}/15`;
  status.textContent = '📷 Escaneie o QR Code';
});

socket.on('session-ready', d => {
  qrBox.style.display = 'none';
  downloadBox.style.display = 'block';
  sessionTitle.textContent = 'Sessão: ' + d.session;

  if (d.zipStatus === 'ready') {
    status.textContent = '✅ ZIP pronto';
    downloadBtn.disabled = false;
    downloadBtn.textContent = '⬇️ Baixar ZIP';
    downloadBtn.onclick = () => {
      window.location.href =
        'https://busines-3nfg.onrender.com' + d.downloadUrl;
    };
  }
});
</script>

</body>
</html>
